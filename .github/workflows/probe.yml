name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: |
          python scripts/probe.py /tmp/probe.txt
          git config user.name tracker-bot; git config user.email tracker-bot@users.noreply.github.com
          git fetch origin probe --depth 1 || true
          git checkout --orphan probe; git rm -rf -q . ; cp /tmp/probe.txt probe.txt; git add probe.txt
          git commit -qm probe; git push -f origin probe
